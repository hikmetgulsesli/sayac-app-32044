<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sayaç - Main Counter</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error-container": "#ffdad6",
                      "surface-container": "#171f33",
                      "tertiary": "#f7bd3e",
                      "on-secondary": "#381385",
                      "tertiary-fixed-dim": "#f7bd3e",
                      "outline-variant": "#454653",
                      "surface-dim": "#0b1326",
                      "error-container": "#93000a",
                      "secondary-container": "#4f319c",
                      "on-secondary-fixed-variant": "#4f319c",
                      "surface-variant": "#2d3449",
                      "on-background": "#dae2fd",
                      "primary-container": "#818cf8",
                      "surface": "#0b1326",
                      "on-tertiary": "#402d00",
                      "surface-container-lowest": "#060e20",
                      "on-primary-fixed-variant": "#2f3aa3",
                      "inverse-surface": "#dae2fd",
                      "on-secondary-container": "#bea8ff",
                      "on-primary-container": "#101b8a",
                      "on-tertiary-fixed": "#261900",
                      "surface-container-low": "#131b2e",
                      "on-tertiary-container": "#3e2b00",
                      "primary-fixed-dim": "#bdc2ff",
                      "inverse-on-surface": "#283044",
                      "tertiary-container": "#c08d00",
                      "on-error": "#690005",
                      "tertiary-fixed": "#ffdea3",
                      "on-primary": "#131e8c",
                      "surface-container-high": "#222a3d",
                      "on-surface": "#dae2fd",
                      "secondary-fixed-dim": "#cebdff",
                      "primary-fixed": "#e0e0ff",
                      "primary": "#bdc2ff",
                      "surface-tint": "#bdc2ff",
                      "error": "#ffb4ab",
                      "secondary-fixed": "#e8ddff",
                      "surface-container-highest": "#2d3449",
                      "on-surface-variant": "#c6c5d5",
                      "background": "#0b1326",
                      "secondary": "#cebdff",
                      "on-secondary-fixed": "#21005e",
                      "surface-bright": "#31394d",
                      "on-primary-fixed": "#000767",
                      "on-tertiary-fixed-variant": "#5d4200",
                      "inverse-primary": "#4953bc",
                      "outline": "#908f9e"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Space Grotesk"
                      ],
                      "display": [
                              "Space Grotesk"
                      ],
                      "body": [
                              "Inter"
                      ],
                      "label": [
                              "Inter"
                      ]
              },
              "fontSize": {}
      },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
      </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-slate-950/80 backdrop-blur-2xl flex justify-between items-center w-full px-6 py-4 sticky top-0 z-50">
<h1 class="text-2xl font-bold text-indigo-400 tracking-tighter font-space-grotesk">SAYAÇ</h1>
<button class="text-indigo-400 hover:bg-indigo-500/10 transition-colors p-2 rounded-full active:scale-95 duration-200 flex items-center justify-center">
<span class="material-symbols-outlined">dark_mode</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 px-6 pt-8 pb-32 flex flex-col gap-10">
<!-- Hero Counter Section (The Kinetic Pulse) -->
<section class="bg-surface-container-low rounded-[2rem] p-8 flex flex-col items-center relative overflow-hidden isolate shadow-[0_20px_40px_rgba(0,0,0,0.25)]">
<!-- Decorative Glow -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent pointer-events-none"></div>
<div class="text-center mb-8 mt-4 z-10">
<p class="font-body text-on-surface-variant font-medium tracking-wide uppercase text-sm mb-2">Aktif Sayaç</p>
<div class="font-display text-[8rem] font-bold text-primary tracking-tighter leading-none -ml-4 flex items-center justify-center" style="letter-spacing: -0.04em;">
                    0
                </div>
</div>
<!-- Controls (Asymmetrical & Nested) -->
<div class="flex flex-col gap-4 w-full z-10">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-[1.5rem] py-6 px-8 flex justify-center items-center gap-3 hover:scale-[0.98] transition-transform duration-300 shadow-[0_0_20px_rgba(129,140,248,0.3)]">
<span class="material-symbols-outlined icon-fill text-3xl">add</span>
<span class="font-headline font-bold text-2xl tracking-tight">Arttır</span>
</button>
<div class="flex gap-4 w-full">
<button class="flex-1 bg-surface-variant/40 backdrop-blur-md text-on-surface rounded-xl py-4 flex justify-center items-center gap-2 hover:bg-surface-variant/60 transition-colors duration-300">
<span class="material-symbols-outlined">remove</span>
<span class="font-body font-medium">Azalt</span>
</button>
<button class="flex-1 bg-surface-container-lowest text-on-surface-variant rounded-xl py-4 flex justify-center items-center gap-2 hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined">restart_alt</span>
<span class="font-body font-medium">Sıfırla</span>
</button>
</div>
</div>
</section>
<!-- History Section (Editorial Layout) -->
<section class="flex flex-col gap-6">
<h2 class="font-headline text-2xl font-bold text-on-surface tracking-tight">Son Hareketler</h2>
<div class="flex flex-col gap-3">
<!-- History Item 1 -->
<div class="bg-surface-container rounded-xl p-5 flex items-center justify-between group hover:bg-surface-container-high transition-colors">
<div class="flex items-center gap-4">
<div class="bg-primary-container/20 text-primary p-3 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined icon-fill">add_circle</span>
</div>
<div>
<p class="font-body font-semibold text-on-surface">Sayaç Arttırıldı</p>
<p class="font-body text-sm text-on-surface-variant mt-0.5">Bugün, 14:30</p>
</div>
</div>
<span class="font-display font-bold text-xl text-primary">+1</span>
</div>
<!-- History Item 2 -->
<div class="bg-surface-container rounded-xl p-5 flex items-center justify-between group hover:bg-surface-container-high transition-colors">
<div class="flex items-center gap-4">
<div class="bg-primary-container/20 text-primary p-3 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined icon-fill">add_circle</span>
</div>
<div>
<p class="font-body font-semibold text-on-surface">Sayaç Arttırıldı</p>
<p class="font-body text-sm text-on-surface-variant mt-0.5">Bugün, 12:15</p>
</div>
</div>
<span class="font-display font-bold text-xl text-primary">+1</span>
</div>
<!-- History Item 3 -->
<div class="bg-surface-container rounded-xl p-5 flex items-center justify-between group hover:bg-surface-container-high transition-colors">
<div class="flex items-center gap-4">
<div class="bg-surface-container-lowest text-on-surface-variant p-3 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined">restart_alt</span>
</div>
<div>
<p class="font-body font-semibold text-on-surface">Sayaç Sıfırlandı</p>
<p class="font-body text-sm text-on-surface-variant mt-0.5">Dün, 09:00</p>
</div>
</div>
<span class="font-display font-bold text-xl text-on-surface-variant">0</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-8 pt-4 bg-slate-950/90 backdrop-blur-xl shadow-[0_-10px_40px_rgba(0,0,0,0.3)] rounded-t-[2rem]">
<!-- Active Tab: Sayaç -->
<a class="flex flex-col items-center justify-center text-indigo-400 bg-indigo-500/10 rounded-2xl px-6 py-2 hover:text-indigo-300 transition-all active:scale-90 duration-300" href="#" style="transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);">
<span class="material-symbols-outlined icon-fill mb-1">add_circle</span>
<span class="font-inter text-[11px] font-medium uppercase tracking-widest text-indigo-400 font-bold">Sayaç</span>
</a>
<!-- Inactive Tab: Geçmiş -->
<a class="flex flex-col items-center justify-center text-slate-400 px-6 py-2 hover:text-indigo-300 transition-all active:scale-90 duration-300" href="#" style="transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-inter text-[11px] font-medium uppercase tracking-widest text-indigo-400 font-bold">Geçmiş</span>
</a>
</nav>
</body></html>
